<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pick Meme: Results</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gochi+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="postgame.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4"/>
    <feDisplacementMap in="SourceGraphic" scale="3.5"/></filter>
  </svg>
    <main>
    <section id="screen-result">
      <div id="face"></div>
      <h1 id="title"></h1>
      <p id="detail"></p>
      <p class="ask">Play again?</p>
      <div class="row">
        <button id="btn-yes" class="btn primary">Play again</button>
        <button id="btn-no" class="btn">Exit</button>
      </div>
    </section>
    <section id="screen-exit" hidden>
      <h1>Thanks for playing</h1>
      <p>You can close this tab.</p>
    </section>
  </main>
  <script src="postgame.js"></script>
</body>
</html>
